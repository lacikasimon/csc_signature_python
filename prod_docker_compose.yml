services:
  signing-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in Coolify environment variables}
      APP_ERROR_DETAILS_ENABLED: ${APP_ERROR_DETAILS_ENABLED:-true}
      LOCAL_SIGNING_ENABLED: ${LOCAL_SIGNING_ENABLED:-false}
      LOCAL_SIGNING_COMMON_NAME: ${LOCAL_SIGNING_COMMON_NAME:-CSC Demo Local Signer}
      CSC_SERVICE_URL: ${CSC_SERVICE_URL:-http://csc-not-configured:9000}
      CSC_API_VERSION: ${CSC_API_VERSION:-v1}
      CSC_CREDENTIAL_ID: ${CSC_CREDENTIAL_ID:-local-demo-signer}
      CSC_SEAL_CREDENTIAL_ID: ${CSC_SEAL_CREDENTIAL_ID:-}
      CSC_OAUTH_TOKEN: ${CSC_OAUTH_TOKEN:-}
      CSC_SEAL_OAUTH_TOKEN: ${CSC_SEAL_OAUTH_TOKEN:-}
      SIGNING_TIMEOUT_SECONDS: ${SIGNING_TIMEOUT_SECONDS:-300}
      MAX_PDF_MB: ${MAX_PDF_MB:-25}
      PDF_DIGEST_ALGORITHM: ${PDF_DIGEST_ALGORITHM:-sha256}
    command:
      - uvicorn
      - csc_signing_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5345"
    expose:
      - "5345"
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_HOST_PORT:-5345}:5345"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5345/healthz', timeout=10).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
